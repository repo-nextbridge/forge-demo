# THE DEMO INSTANCE'S STACK — Forge cliente 1, on our own box.
#
# It began as a copy of `templates/instance/compose.yml` from the Forge monorepo and it is OURS to edit, which
# is the whole deal: the images are pinned, everything else here is a decision of this repository. Where it
# DIFFERS from the template, it says why — three places, all marked ★.
#
# Where each value comes from:
#   • the four images   → forge.lock, via `source bin/images-from-lock.sh` (pinned by digest, never a tag)
#   • the boring config → .env (copy .env.example), read automatically by compose from this directory
#   • every secret      → env-source.sh, exported into the shell before compose runs (never written to disk)
# Shell values win over .env, so sourcing env-source.sh is what makes the secrets reach the containers.
#
# Migrations are a one-shot step, never a boot hook. ALWAYS migrate before `up`:
#   docker compose run --rm kernel node dist/migrate.js
#   docker compose up -d
#
# ★ WHERE A FRONT THIS FILE DOES NOT KNOW ABOUT GOES. The coffee store's vitrine is a FORK of the reference
# storefront (slice C1: `pack-surface` → a Next project of this repo's own, built into an image of its own).
# It is a deployable, and whoever creates a deployable wires it — so its service is NOT guessed at here.
#
# The seam is `compose.override.yml`, which `docker compose` merges automatically when the file exists, next
# to a routing file the edge imports (`caddy/extra-local/` on the bench, `caddy/extra/` in a deployment — two
# folders because the two edges read them differently, see caddy/extra-local/README.md; both
# folders are already mounted below). Adding that front therefore costs C1 two NEW files and no edit to any
# file committed here, which is the same deal the platform gives this repo about the kernel.

services:
  # ★ DIFFERENCE 1 — POSTGRES IS HERE, AND THE TEMPLATE SAYS IT SHOULD NOT BE.
  #
  # The template is right for a customer: "use a MANAGED Postgres 18 and point DATABASE_URL at it", because
  # the entire store lives in that database and you want somebody else taking the backups. This box is a
  # DEMO — a bench that is rebuilt on purpose and holds nothing anyone would mourn — so it carries its own,
  # pinned to the same major the platform pins (18, parity dev↔prod) and mounted at /var/lib/postgresql (the
  # PG 18+ convention).
  #
  # ⚠️ THE DAY THIS DEMO HOLDS SOMETHING REAL, THIS SERVICE COMES OUT and DATABASE_URL points at a managed
  # instance. That is not a refactor; it is deleting eleven lines and changing one variable.
  postgres:
    image: postgres:18
    restart: unless-stopped
    # ── ⛔⛔ /dev/shm, AND DOCKER'S 64 MB DEFAULT IS TOO SMALL FOR THIS BOX'S OWN SEED ─────────────────────
    #
    # MEASURED ON THE STAGING VM, 2026-09-16. The massive seed's one-shot died with the database's own words:
    #
    #     could not resize shared memory segment "/PostgreSQL.3914999898" to 8388608 bytes:
    #     No space left on device
    #
    # ⚠️ THAT SENTENCE NAMES THE WRONG THING TO ANYONE READING IT IN A HURRY. It is not the disk (26 GB free)
    # and not the host's `/dev/shm` (981 MB free): it is the CONTAINER's, which Docker gives 64 MB by default
    # — measured inside `forge-demo-postgres-1`, `shm 64M`. Postgres puts a parallel query's shared tuple
    # store there, so the failure arrives on a big read in the middle of a write nobody is watching, and the
    # catalogue comes out half filled.
    #
    # ⚠️ AND THE BENCH NEVER SHOWED IT, WHICH IS WHY IT IS WRITTEN HERE RATHER THAN REMEMBERED: the same 64 MB
    # is the default on a laptop too, and there the planner never had to spill. A limit that only bites where
    # the machine is smaller is a limit that is discovered in production.
    #
    # 256 MB is four times the default and a rounding error beside this box's 2 GB of RAM (`/dev/shm` is
    # tmpfs: it costs what it holds, not what it declares).
    shm_size: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (env-source.sh) — the demo's database is still a database}
      POSTGRES_DB: ${POSTGRES_DB:-forge}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # From INSIDE is acceptable HERE and is not what the platform's oven does: `depends_on` gates the
      # kernel's start, and if the probe answers early the kernel simply retries its connection. The oven's
      # rule (probe from another container, over TCP) exists because a MIGRATION that runs too early fails
      # for good — which is why `migrate` is a one-shot you run by hand, after `up`.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-forge} -d ${POSTGRES_DB:-forge}']
      interval: 5s
      timeout: 5s
      retries: 20

  kernel:
    image: ${FORGE_IMAGE:?run `source bin/images-from-lock.sh` first — the image ref comes from forge.lock}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # The version the running kernel reports (read.platform_info) — from forge.lock's forgeVersion.
      FORGE_KERNEL_VERSION: ${FORGE_KERNEL_VERSION:-unpinned}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (env-source.sh) to this box's Postgres connection string}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Encrypts the connection secrets apps store. Rotating it re-keys them — keep it somewhere you can restore.
      FORGE_VAULT_KEY: ${FORGE_VAULT_KEY:?set FORGE_VAULT_KEY (env-source.sh) to a stable random key}
      # ★ DIFFERENCE 2 — MEDIA: THE BENCH KEEPS IT ON THIS BOX'S DISK, A DEPLOYED BOX PUTS IT IN A BUCKET.
      # The demo's product photos are seeded through the port (bin/seed.mjs). With FORGE_STORAGE_DRIVER unset
      # the kernel's local driver stores them under FORGE_MEDIA_LOCAL_DIR and serves them itself, and an empty
      # FORGE_MEDIA_BASE_URL makes it DERIVE the read URL from FORGE_PUBLIC_ORIGIN — which is what a bench
      # wants and what `.env` in this repository declares. `deploy/box.env` declares the other posture.
      FORGE_MEDIA_LOCAL_DIR: /data/media
      FORGE_MEDIA_BASE_URL: ${FORGE_MEDIA_BASE_URL:-}
      FORGE_PUBLIC_ORIGIN: ${FORGE_PUBLIC_ORIGIN:?set FORGE_PUBLIC_ORIGIN (.env) to the address a browser reaches this stack at — the local media URLs are derived from it}
      # ── the bucket, when there is one ─────────────────────────────────────────────────────────────────────
      # ⚠️ EIGHT NAMES, AND THE SET A DRIVER NEEDS IS THE DRIVER'S BUSINESS, NOT THIS FILE'S. `gcs` signs with
      # a service account (CLIENT_EMAIL + PRIVATE_KEY, or neither and the VM's own identity); `s3` signs SigV4
      # with an ACCESS_KEY_ID + SECRET_ACCESS_KEY against an ENDPOINT. Every one of them is forwarded whatever
      # the driver is, because a container that receives only half of a set cannot say which half it is
      # missing — `createStorageBackend` refuses by name, and it can only do that if the names reach it.
      #
      # ⛔⛔ THE FOUR `s3` NAMES WERE ABSENT FROM THIS BLOCK UNTIL 2026-09-16, and the absence was silent in
      # the worst way. `apps/api/src/storage-connector.ts` reads them from ITS environment; compose forwards
      # only what is listed here; so a box whose `.env` said `s3` and whose shell held the credentials still
      # handed the kernel an endpoint-less, key-less `s3` — and the kernel threw at boot. ⇒ Adding a driver to
      # the PRODUCT does not add it to this box: the variables are a second wire, and it is this one.
      FORGE_STORAGE_DRIVER: ${FORGE_STORAGE_DRIVER:-}
      FORGE_STORAGE_BUCKET: ${FORGE_STORAGE_BUCKET:-}
      FORGE_STORAGE_ENDPOINT: ${FORGE_STORAGE_ENDPOINT:-}
      FORGE_STORAGE_REGION: ${FORGE_STORAGE_REGION:-}
      FORGE_STORAGE_ACCESS_KEY_ID: ${FORGE_STORAGE_ACCESS_KEY_ID:-}
      FORGE_STORAGE_SECRET_ACCESS_KEY: ${FORGE_STORAGE_SECRET_ACCESS_KEY:-}
      FORGE_STORAGE_CLIENT_EMAIL: ${FORGE_STORAGE_CLIENT_EMAIL:-}
      FORGE_STORAGE_PRIVATE_KEY: ${FORGE_STORAGE_PRIVATE_KEY:-}
      # ★★ LOGIN E-MAIL. ALL FOUR OR NONE — a partial set is a FATAL BOOT ERROR that names the missing one.
      #
      # ⚠️ THIS BLOCK USED TO PROMISE THAT LEAVING THEM UNSET MAKES THE KERNEL LOG THE CODE TO THE TERMINAL,
      # AND THAT WAS NEVER TRUE HERE. This file declares `NODE_ENV: production` four blocks up, and the
      # transport that writes a message to stderr is constructible ONLY under `!production`
      # (apps/api/src/smtp-channel-driver.ts) — deliberately, because printing a credential to a terminal must
      # be impossible in production BY CONSTRUCTION rather than by a flag. What a production box with no mail
      # actually gets is the transport that FAILS BY NAME on every message: no OTP reaches anyone, and nobody
      # can log in. The two sentences sat in one file contradicting each other for a whole wave, and the cost
      # was an afternoon on a bench nobody could enter.
      #
      # So: this box CONFIGURES the full set. The values are assembled in `env-source.sh`, where the presence
      # of the `forge-smtp-pass` secret decides whether the set exists at all — three here and a conditional
      # password would rebuild the partial set that refuses to boot.
      # WHERE THE CODE ARRIVES: the mailbox of `FORGE_ADMIN_SEED_EMAIL` — unless this box declared the BENCH
      # COLLECTOR, in which case it arrives in the `mailpit` service below and NOTHING leaves this machine.
      # Which of the two is a declaration and never an accident: `FORGE_BENCH_MAILBOX` in `.env`, read by
      # `env-source.sh`, which assembles these four. There is no terminal inbox on this box in either mode.
      # `bin/dev-mail-promise.guard.mjs` holds this comment to the code that would have to keep it.
      FORGE_SMTP_HOST: ${FORGE_SMTP_HOST:-}
      FORGE_SMTP_PORT: ${FORGE_SMTP_PORT:-}
      FORGE_SMTP_USER: ${FORGE_SMTP_USER:-}
      FORGE_SMTP_PASS: ${FORGE_SMTP_PASS:-}
      FORGE_SMTP_FROM: ${FORGE_SMTP_FROM:-}
      # ★★ THE COLLECTOR'S CERTIFICATE, AND IT IS HERE BECAUSE THE DRIVER LEAVES NO CHOICE. The transport is
      # built as `requireTLS: !secure` (apps/api/src/smtp-channel-driver.ts), and nodemailer sends `STARTTLS`
      # whether or not the server advertises it, then refuses to deliver if the upgrade fails. Measured
      # 2026-09-14 against nodemailer 9.0.3, the version the pinned image carries:
      #     plain collector  → ETLS    «Error upgrading connection with STARTTLS: 502 5.5.1 Not implemented»
      #     self-signed, untrusted → ESOCKET «self-signed certificate»
      #     the same cert, with this variable → DELIVERED «250 2.0.0 Ok: queued»
      # ⇒ a local collector is not four variables, it is four variables AND this one. EMPTY in a deployment,
      # where the mailbox is a real provider with a public chain and Node needs no help. See mail/README.md.
      NODE_EXTRA_CA_CERTS: ${FORGE_MAIL_CA:-}
      # Read only by the one-shot bootstrap (`run --rm kernel node dist/provision-ref.js`): the tenant, store
      # and first operator this instance is created with. The demo's OTHER stores are created by bin/seed.mjs,
      # through the port, because a second store is data and not bootstrap.
      # ★ THE DATASET POINTER. Unset → `seed-demo` answers "nothing to seed", which is the correct state for an
      # instance that wants no example data. Set → the one-shot fills the store it is aimed at.
      FORGE_SEED_DATASET_DIR: ${FORGE_SEED_DATASET_DIR:-}
      # Where the photo payload is hydrated to, kept OFF the read-only dataset mount. See the volumes above.
      FORGE_SEED_PHOTOS_DIR: ${FORGE_SEED_PHOTOS_DIR:-}
      FORGE_REF_TENANT: ${FORGE_REF_TENANT:-}
      FORGE_REF_STORE_HANDLE: ${FORGE_REF_STORE_HANDLE:-}
      FORGE_REF_STORE_NAME: ${FORGE_REF_STORE_NAME:-}
      FORGE_ADMIN_SEED_EMAIL: ${FORGE_ADMIN_SEED_EMAIL:-}
      FORGE_ADMIN_SEED_NAME: ${FORGE_ADMIN_SEED_NAME:-}
      # ★★ THE MOUNT FOR AN APP THIS BOX WANTS WITHOUT REBUILDING (FORGE_EXTENSIONS_DIR). It is EMPTY today and
      # that is the state, not an omission: this box's own apps used to arrive this way and are now COMPOSED
      # into the images (`instanceApps` in composition.json), which is what gives one a screen — a mounted app reaches
      # the kernel and renders nothing, because a front draws an app only from the composition. The two must
      # never both carry the same app: a composed id mounted on top of itself is a duplicate the kernel
      # refuses at boot. The seam stays because a box may still want an app of ACTIONS ONLY, with no rebuild.
      FORGE_EXTENSIONS_DIR: ${FORGE_EXTENSIONS_DIR:-}
      # Busting the storefront's cache when something a shopper can see changes. Both are needed.
      FORGE_STOREFRONT_URL: ${FORGE_STOREFRONT_URL:-http://storefront:3000}
      FORGE_REVALIDATE_SECRET: ${FORGE_REVALIDATE_SECRET:-}
      FORGE_RATE_LIMIT_PER_CREDENTIAL: ${FORGE_RATE_LIMIT_PER_CREDENTIAL:-}
      FORGE_RATE_LIMIT_WINDOW_SECONDS: ${FORGE_RATE_LIMIT_WINDOW_SECONDS:-}
      # ★★ 04/09 — THE ANONYMOUS WRITE FACE'S CEILING, and it is here because a knob the compose does not
      # forward is a knob that does nothing WITHOUT SAYING SO. `pk7/p1` gave this ceiling an env on the
      # kernel; setting it in `.env` moved nothing until this line existed, and the kernel came up on the
      # default while the operator believed otherwise — the same shape as the refusal that used to name the
      # wrong button. Empty here means the kernel's own default (30/60s), which is what production wants.
      FORGE_PUBLIC_WRITE_LIMIT_PER_IP: ${FORGE_PUBLIC_WRITE_LIMIT_PER_IP:-}
      FORGE_PUBLIC_WRITE_WINDOW_SECONDS: ${FORGE_PUBLIC_WRITE_WINDOW_SECONDS:-}
    volumes:
      # Our extensions, read-only: the kernel loads this code, it never writes it.
      - ${FORGE_EXTENSIONS_HOST_DIR:-./extensions}:/app/extensions:ro
      # ★★ THE SEED DATASET — mounted BY PATH and READ-ONLY, and both halves are deliberate.
      #
      # BY PATH because it is 40 MB of JSON pointing at 3.6 GB of photographs, and copying that into this
      # repository would put a generator's output in a place a human edits. It lives in the monorepo
      # (`instances/demo/dataset`) and this box points at it.
      #
      # READ-ONLY because the seed WRITES when it hydrates — and what it writes is the photo tree, which is
      # why the photo tree is pointed somewhere else (below). Mounting this read-write would land gigabytes
      # inside a shared git worktree, which is a working tree somebody else is using.
      - ${FORGE_SEED_DATASET_HOST_DIR:-./seed/dataset}:/app/seed-dataset:ro
      # ★ WHERE THE 3.6 GB LANDS. `FORGE_SEED_PHOTOS_DIR` exists exactly for this ("a VM whose container layer
      # cannot hold the gigabytes points it at a big-disk mount") and it is what lets the dataset above stay
      # read-only. A named volume, so it survives a re-run and is not re-pulled: the hydration skips a file
      # already on disk, so the second seed of a box costs nothing.
      - seed_photos:/data/seed-photos
      - media:/data/media
      # ★ THE BENCH COLLECTOR'S CERTIFICATE — mounted ALWAYS and read only when `FORGE_MAIL_CA` names it, so
      # there is no conditional mount and no birth step that can be forgotten. A deployment carries the file
      # and never points Node at it. `mail/README.md` says why the pair is committed and why it is not a
      # secret.
      - ./mail:/mail:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  storefront:
    image: ${FORGE_STOREFRONT_IMAGE:?run `source bin/images-from-lock.sh` first — the image ref comes from forge.lock}
    restart: unless-stopped
    environment:
      # ⚠️ F11, SEGUNDA VEZ — 04/09. Sem esta linha a vitrine cai no 3º degrau de `resolveOrigin`
      # (host da requisição + `x-forwarded-proto`, que a borda não manda ⇒ **http**), e o aquecedor
      # monta todas as URLs num esquema que este host não serve: 831 planejadas, 0 aquecidas.
      # O guard `env-forwarding` do produto pega isto — e grada os 3 composes DELE, não este.
      FORGE_PUBLIC_ORIGIN: ${FORGE_PUBLIC_ORIGIN:-}
      # ★★ THE GATE SLOT'S OWN WIRING, read on the SERVER when a gate block renders (Forge P1).
      #
      # ⛔⛔ AND SINCE v0.4 NOTHING IN THIS BOX READS THESE TWO. The app that did was the demo's gate, and it
      # left the repository with the slot it filled (an app INSTALLED on `storefront:gate` takes every store
      # off the cacheable tree). They stay declared because the promotion machinery writes and grades them
      # — `bin/box-up.sh`, `bin/verify-config.mjs`, `bin/box-config.guard.mjs` — and unpicking that is a
      # slice of its own, not a line in this one. ⚠️ A READER SHOULD NOT INFER A CONSUMER FROM A VARIABLE.
      #
      # ⚠️ IT MOVED HERE FROM THE KERNEL, and the move is the whole shape of what P1 changed. While that app
      # was only MOUNTED, the kernel was the only process that had it at all — and it had no screen.
      # Now it is COMPOSED into the fronts, so `gateWiring()` runs in THIS process, inside a Server Component,
      # and these variables have to be where the component is. They never reach the browser: the entry resolves
      # them and hands the values down as props.
      FORGE_GATE_SITE_URL: ${FORGE_GATE_SITE_URL:-}
      # ★★ ONE DISMISSAL FOR THE WHOLE DEMO. `packages/storefront-kit/src/gate/cookie-scope.ts` (pk35/p5) made
      # the gate's dismissal scope DECLARABLE, and this box never declared it — so entering at one of the six
      # faces left the other five still greeting, because a cookie with no `domain` belongs to the origin that
      # wrote it. ⚠️ The kit checks the declared suffix against the address the browser really used and falls
      # back to HOST-ONLY when it does not match, so a bench on `localhost` is unaffected and says so.
      FORGE_STOREFRONT_GATE_COOKIE_DOMAIN: ${FORGE_STOREFRONT_GATE_COOKIE_DOMAIN:-}
      FORGE_GATE_ADMIN_URLS: ${FORGE_GATE_ADMIN_URLS:-}
      NODE_ENV: production
      PORT: 3000
      FORGE_READ_BASE_URL: http://kernel:3000
      FORGE_COMMAND_BASE_URL: http://kernel:3000
      FORGE_STORE_HOSTS: ${FORGE_STORE_HOSTS:-}
      # ★ DIFFERENCE 4 (D2) — THE FRONTS NEED THE MEDIA BASE EVEN WHEN THE KERNEL DOES NOT.
      #
      # The kernel's stays EMPTY on this box (see DIFFERENCE 2): it mints a public media address from the
      # public origin and the local driver, and giving it an internal host would put `http://kernel:3000/…`
      # in a shopper's HTML. The FRONTS join base+key themselves, server-side, for a different job — the
      # DERIVATIVE door (`/api/img`), which is how a composed banner is served since the F3 slice.
      #
      # MEASURED, and it is why this line exists: with the base unset, `/api/img/orig/…` answers
      # `404 media base not configured` and every tile of the Outlet's banner mosaic is a broken image,
      # while product photos beside it are fine (those render the kernel's own minted url). The default is
      # the kernel's local-driver route on the compose network — server-to-server, never in a page.
      FORGE_MEDIA_BASE_URL: ${FORGE_MEDIA_BASE_URL:-http://kernel:3000/v1/media/local}
      FORGE_REVALIDATE_SECRET: ${FORGE_REVALIDATE_SECRET:-}
      FORGE_BULK_READ_TOKEN: ${FORGE_BULK_READ_TOKEN:-}
      # ★ DIFFERENCE 3 — THE THEMES DIRECTORY, AND THE TEMPLATE DOES NOT WIRE IT.
      #
      # A store names its theme with `theme_key`, and the front looks for `<FORGE_THEMES_DIR>/<key>`
      # (packages/storefront-kit/src/theme/resolve.ts). `templates/instance/.env.example` documents the
      # variable — and `templates/instance/compose.yml` passes it to no container and mounts no directory, so
      # setting it there does NOTHING. Measured, and reported upstream as template debt. The demo needs it for
      # real (`outlet`, `coffee-store`), so both fronts get the mount and the variable.
      FORGE_THEMES_DIR: ${FORGE_THEMES_DIR:-/app/themes-instance}
    volumes:
      - ${FORGE_THEMES_HOST_DIR:-./themes}:/app/themes-instance:ro
    depends_on:
      - kernel

  # The CHECKOUT — the other half of the shop's front, on the SAME hostname, split by path at the edge.
  # Ours, unforked, and it stays that way: the vitrine is what the demo dresses up (C1), the checkout is what
  # it dresses up with a THEME (C2).
  checkout:
    image: ${FORGE_CHECKOUT_IMAGE:?run `source bin/images-from-lock.sh` first — the image ref comes from forge.lock}
    restart: unless-stopped
    environment:
      # ⚠️ F11, SEGUNDA VEZ — 04/09. Sem esta linha a vitrine cai no 3º degrau de `resolveOrigin`
      # (host da requisição + `x-forwarded-proto`, que a borda não manda ⇒ **http**), e o aquecedor
      # monta todas as URLs num esquema que este host não serve: 831 planejadas, 0 aquecidas.
      # O guard `env-forwarding` do produto pega isto — e grada os 3 composes DELE, não este.
      FORGE_PUBLIC_ORIGIN: ${FORGE_PUBLIC_ORIGIN:-}
      # ★★ THE GATE SLOT'S OWN WIRING, read on the SERVER when a gate block renders (Forge P1).
      #
      # ⛔⛔ AND SINCE v0.4 NOTHING IN THIS BOX READS THESE TWO. The app that did was the demo's gate, and it
      # left the repository with the slot it filled (an app INSTALLED on `storefront:gate` takes every store
      # off the cacheable tree). They stay declared because the promotion machinery writes and grades them
      # — `bin/box-up.sh`, `bin/verify-config.mjs`, `bin/box-config.guard.mjs` — and unpicking that is a
      # slice of its own, not a line in this one. ⚠️ A READER SHOULD NOT INFER A CONSUMER FROM A VARIABLE.
      #
      # ⚠️ IT MOVED HERE FROM THE KERNEL, and the move is the whole shape of what P1 changed. While that app
      # was only MOUNTED, the kernel was the only process that had it at all — and it had no screen.
      # Now it is COMPOSED into the fronts, so `gateWiring()` runs in THIS process, inside a Server Component,
      # and these variables have to be where the component is. They never reach the browser: the entry resolves
      # them and hands the values down as props.
      FORGE_GATE_SITE_URL: ${FORGE_GATE_SITE_URL:-}
      # ★★ ONE DISMISSAL FOR THE WHOLE DEMO. `packages/storefront-kit/src/gate/cookie-scope.ts` (pk35/p5) made
      # the gate's dismissal scope DECLARABLE, and this box never declared it — so entering at one of the six
      # faces left the other five still greeting, because a cookie with no `domain` belongs to the origin that
      # wrote it. ⚠️ The kit checks the declared suffix against the address the browser really used and falls
      # back to HOST-ONLY when it does not match, so a bench on `localhost` is unaffected and says so.
      FORGE_STOREFRONT_GATE_COOKIE_DOMAIN: ${FORGE_STOREFRONT_GATE_COOKIE_DOMAIN:-}
      FORGE_GATE_ADMIN_URLS: ${FORGE_GATE_ADMIN_URLS:-}
      NODE_ENV: production
      PORT: 3000
      FORGE_READ_BASE_URL: http://kernel:3000
      FORGE_COMMAND_BASE_URL: http://kernel:3000
      # ★ The checkout renders SERVER-SIDE too, so what it builds on the box's own behalf pays from the same
      # budget the storefront's documents do — a front that forwards no reader spends the SHOPPER's ceiling.
      FORGE_BULK_READ_TOKEN: ${FORGE_BULK_READ_TOKEN:-}
      FORGE_STORE_HOSTS: ${FORGE_STORE_HOSTS:-}
      # The same base, for the same reason, on the other front: it renders the cart's product photos and
      # its own theme's banners through the same door. See DIFFERENCE 4 on the storefront above.
      FORGE_MEDIA_BASE_URL: ${FORGE_MEDIA_BASE_URL:-http://kernel:3000/v1/media/local}
      FORGE_GOOGLE_CLIENT_ID: ${FORGE_GOOGLE_CLIENT_ID:-}
      FORGE_GOOGLE_CLIENT_SECRET: ${FORGE_GOOGLE_CLIENT_SECRET:-}
      FORGE_GOOGLE_REDIRECT_URI: ${FORGE_GOOGLE_REDIRECT_URI:-}
      FORGE_APPLE_SERVICE_ID: ${FORGE_APPLE_SERVICE_ID:-}
      FORGE_APPLE_TEAM_ID: ${FORGE_APPLE_TEAM_ID:-}
      FORGE_APPLE_KEY_ID: ${FORGE_APPLE_KEY_ID:-}
      FORGE_APPLE_PRIVATE_KEY: ${FORGE_APPLE_PRIVATE_KEY:-}
      FORGE_APPLE_REDIRECT_URI: ${FORGE_APPLE_REDIRECT_URI:-}
      FORGE_APPLE_DOMAIN_ASSOCIATION: ${FORGE_APPLE_DOMAIN_ASSOCIATION:-}
      # ⚠️ THIS KEY BELONGS TO THIS CONTAINER AND TO NO OTHER — never copy it up to the storefront.
      FORGE_CUSTOMER_ASSERTION_PRIVATE_KEY: ${FORGE_CUSTOMER_ASSERTION_PRIVATE_KEY:-}
      # ★ DIFFERENCE 3, second half. The checkout resolves the store's theme too (C2 dresses `/checkout` and
      # `/account` in `coffee-store`), so it needs the same folder mounted at the same path. A themes mount on
      # the vitrine alone gives a shop that changes clothes at the "Finalizar compra" button.
      FORGE_THEMES_DIR: ${FORGE_THEMES_DIR:-/app/themes-instance}
    volumes:
      - ${FORGE_THEMES_HOST_DIR:-./themes}:/app/themes-instance:ro
    depends_on:
      - kernel

  admin:
    image: ${FORGE_ADMIN_IMAGE:?run `source bin/images-from-lock.sh` first — the image ref comes from forge.lock}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      FORGE_API_BASE_URL: http://kernel:3000
      FORGE_API_PUBLIC_URL: ${FORGE_PUBLIC_ORIGIN}
      FORGE_STOREFRONT_URL: http://storefront:3000
      FORGE_STOREFRONT_PUBLIC_URL: ${FORGE_PUBLIC_ORIGIN}
      FORGE_REVALIDATE_SECRET: ${FORGE_REVALIDATE_SECRET:-}
      FORGE_ADMIN_TENANT: ${FORGE_ADMIN_TENANT?set FORGE_ADMIN_TENANT in .env to the tenant id this admin manages, or leave it EMPTY for a box that serves several brands by hostname}
      FORGE_ADMIN_SERVICE_TOKEN: ${FORGE_ADMIN_SERVICE_TOKEN:-}
      FORGE_ADMIN_PLATFORM_TOKEN: ${FORGE_ADMIN_PLATFORM_TOKEN:-}
      # ★★★ THE GATE'S `/enter` DOOR, ONE ENTRY PER TENANT (pk38/d8) — what makes "abrir o admin" land SIGNED
      # IN instead of on a login screen, and what makes a REGENERATED box need no gesture from anybody.
      #
      #     {"<tenant id>": {"store": "<store id>", "key": "<redeemable key>"}}
      #
      # The tenant id is the one `read.admin.by_host` answers for the hostname the browser asked for; the
      # store is a store OF THAT TENANT, because the kernel's redeem face is public and takes a store instead
      # of a credential — the store is what fixes which tenant the key is checked against. Nothing here is
      # ever typed by a human: the ids are fresh ULIDs and the key is minted anew at every birth, assembled
      # by `env-source.sh` out of the secret store and `.env`.
      #
      # ⛔ A MAP, BECAUSE ONE CONTAINER SERVES TWO BRANDS BY HOSTNAME. A key belongs to ONE tenant, so a
      # singular variable here would sign a visitor on one brand's hostname into the OTHER brand's tenant.
      # That is the front-door leak the route refuses to guess its way around; per-tenant configuration is
      # what lifts the refusal, and a tenant with no entry keeps the refusal — it never borrows another's.
      #
      # ⚠️ SOFT (`:-`) on purpose: an instance that configures none has no gate door, and `/enter` falls
      # through to the login screen exactly as an ungated instance always has.
      FORGE_ADMIN_ACCESS_KEYS: ${FORGE_ADMIN_ACCESS_KEYS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      FORGE_ADMIN_OPS_LOGIN: ${FORGE_ADMIN_OPS_LOGIN:-}
      FORGE_ADMIN_I18N_DIR: ${FORGE_ADMIN_I18N_DIR:-}
      FORGE_ADMIN_DEFAULT_LOCALE: ${FORGE_ADMIN_DEFAULT_LOCALE:-}
    volumes:
      - ${FORGE_ADMIN_I18N_HOST_DIR:-./i18n}:/app/i18n:ro
    depends_on:
      - kernel

  # TLS + routing.
  #
  # ⚠️ WHICH CADDYFILE IS A CHOICE, AND THE DEFAULT IS THE SAFE ONE. `./caddy/Caddyfile` is the real edge:
  # automatic TLS and a CLOSED control face. `./caddy/Caddyfile.local` is the bench edge: plain HTTP on one
  # port, no TLS, no perimeter. The default is the production file so that FORGETTING to choose gives you the
  # closed door — `.env.example` (which is the bench's config) points at the local one explicitly.
  caddy:
    image: caddy:2
    restart: unless-stopped
    # ★★★ pk24/d4 — EVERY DOOR THIS BOX PUBLISHES NAMES THE INTERFACE IT IS PUBLISHED ON, AND THE BOX HAS
    # TO SAY WHICH. Same species `pk23/p5` closed on the product's `:3033`, and it is not about the numbers
    # (that is `bin/bench-ports.guard.mjs`, a different question about these same lines) — it is about who
    # can reach them.
    #
    # ⛔ THE DEFECT, MEASURED. Every front on this box declares `NODE_ENV: production`, so `secureCookie()`
    # is true — `packages/storefront-kit/src/cookies.ts:85` for the shopper's cookies, the admin image's
    # `apps/admin/src/lib/session.ts:21` for the operator's — and a browser SILENTLY refuses a `Secure`
    # cookie on any plain-http origin that is not `localhost`. Every door below is plain http on the bench
    # (`caddy/Caddyfile.local` carries no TLS), so a door published on every interface answers 200 to a
    # phone on the tailnet and then loses the cart, or the session, with nothing on screen saying why.
    # `bin/box-up.sh` already carries the browser measurement of exactly that, on `http://<tailnet>:8201`:
    # «the login succeeds, the jar keeps nothing, and the next request bounces». Measured again 2026-09-08,
    # before this line existed: `:8200/health`, `:8201/login`, `:8202/login` and `:8203/` all answered 200
    # from off the box.
    #
    # ⚠️ AND `Secure` CANNOT BE TURNED OFF FROM HERE. `FORGE_STOREFRONT_SECURE_COOKIE` and
    # `FORGE_ADMIN_SECURE_COOKIE` are opt-INS (`NODE_ENV === 'production' || … === '1'`), and this box passes
    # neither to any container. The interface is the only place this trap can be closed.
    #
    # ★ SO THE VALUE IS DEMANDED, NEVER DEFAULTED. `${FORGE_BENCH_BIND?…}` — WITHOUT the colon, exactly like
    # `FORGE_ADMIN_TENANT` below: it must EXIST and it MAY be empty. Empty is byte-for-byte what this file
    # published before (measured with `docker compose config`: no `host_ip`, so the IPv6 listener a
    # deployment has today survives), so a deployment declares it empty and NOTHING about a deployment
    # changes. `.env.example` — which is the BENCH's configuration, the same seam that decides the port
    # numbers — ships `127.0.0.1`, and that is what closes the trap here. A box that says nothing at all is
    # refused BY NAME before the first container starts, which is the one thing a silent default could never
    # do.
    #
    # ⚠️ THE TAILNET KEEPS ITS DOOR, AND THAT IS WHY LOOPBACK IS ENOUGH. `tailscale serve` terminates TLS and
    # proxies to `http://127.0.0.1:<port>` — read from `tailscale serve status --json` on this machine,
    # 2026-09-08, for all four of these ports. Loopback removes the plain-http door and nothing else.
    #
    # ⚠️ ONE VARIABLE FOR ALL FIVE, INCLUDING `:443`, WHICH IS NOT ITSELF A TRAP. The bench never answers on
    # it (`caddy/Caddyfile.local` is HTTP-only — measured inside the container: `nc -z 127.0.0.1 443` → 1),
    # and a deployment's `:443` is https and safe. It is here anyway because "this box publishes on <this
    # interface>" is ONE decision, and a per-port exception is exactly the half-applied rename that made this
    # file publish 8102 while every document said 8203.
    ports:
      - '${FORGE_BENCH_BIND?see .env.example — 127.0.0.1 on a bench, EMPTY to publish on every interface}:${FORGE_HTTP_PORT:-80}:80'
      - '${FORGE_BENCH_BIND?see .env.example — 127.0.0.1 on a bench, EMPTY to publish on every interface}:${FORGE_HTTPS_PORT:-443}:443'
      # BENCH ONLY, and harmless in a deployment: the production Caddyfile has no `:81` site, so nothing
      # answers here and the published port is inert. On the bench it is the admin's own origin — a path
      # prefix does not work (the admin is a Next app with no basePath; see caddy/Caddyfile.local).
      - '${FORGE_BENCH_BIND?see .env.example — 127.0.0.1 on a bench, EMPTY to publish on every interface}:${FORGE_ADMIN_HTTP_PORT:-8081}:81'
      # ★ THE SECOND TENANT'S ADMIN DOOR (PRE-SEED · P-A). Same container as `:81`; the PORT is what
      # `read.admin.by_host` keys on, so two tenants on one `localhost` need two published ports. See
      # caddy/Caddyfile.local, `:83`.
      - '${FORGE_BENCH_BIND?see .env.example — 127.0.0.1 on a bench, EMPTY to publish on every interface}:${FORGE_ADMIN2_HTTP_PORT:-8202}:83'
    # ★★★ THE SIX ADDRESSES OF THIS BOX, AND THIS BLOCK IS THE END THAT WAS MISSING (pk34/d1).
    #
    # ⛔ THE DEFECT, MEASURED 2026-09-12 ON THE LIVE BENCH. `docker inspect …-caddy-1` showed this container
    # holding THREE FORGE_* variables: FORGE_DOMAIN, FORGE_ADMIN_DOMAIN, FORGE_CONTROL_ALLOW_CIDR.
    # `caddy/Caddyfile` had a `{$FORGE_TOTEM_DOMAIN}` site block and NOTHING EVER PASSED THAT VARIABLE, so it
    # resolved to the empty string on every box — and an empty site address is not a missing host:
    #
    #     caddy validate → Error: adapting config using caddyfile: server block without any key is global
    #                             configuration, and if used, it must be first
    #
    # Reproduced against the real file with exactly those three variables. `./caddy/Caddyfile` is the DEFAULT
    # below, so the edge a deployment of this instance would have got could not load at all: store, checkout
    # and admin down together. The bench never showed it because `.env.example` opts into the local edge.
    #
    # ★★ AND THE DEFAULTS ARE HERE RATHER THAN ONLY IN THE CADDYFILE, WHICH IS A MEASUREMENT AND NOT A
    # BELT-AND-BRACES. Caddy's `{$VAR:fallback}` fires only when the variable is UNSET; measured with
    # `caddy:2` v2.11.4, a variable that is PRESENT AND EMPTY beats the fallback and the site address is
    # empty again — the dead edge, back. Compose's own `${VAR:-x}` (WITH the colon) substitutes for unset AND
    # empty, and `.env.example` ships these lines empty, so this is what makes the fallback real. The two
    # spellings of each sentinel are pinned equal by `bin/box-domains.guard.mjs`.
    #
    # ★★ TWO SPELLINGS, AND THE DIFFERENCE IS WHICH VARIABLES A BOX MAY NOT BE BORN WITHOUT.
    #
    # `:?` DEMANDED — the first two. A variable demanded this way stops `docker compose` BY NAME before the
    # first container, so it can never reach Caddy empty at all: a stronger guarantee than any fallback, and
    # the loudest signal this file can give. Both have always been demanded and both stay that way; every
    # `.env` on every bench already carries them.
    #
    # `:-` SENTINEL — the other four, and the reason is the birth rather than the design. A demanded variable
    # refuses `docker compose` on every box whose `.env` predates this block, which is EVERY bench that
    # exists — and the local birth may not regress. So they fall back, and the loud half moves to the end of
    # the birth where it can be honest: `bin/verify-config.mjs` names every face still on its sentinel.
    #
    # ⛔ `bin/box-domains.guard.mjs` demands one or the other for every variable the Caddyfile reads, and pins
    # each `:-` value to the Caddyfile's own fallback. Neither is decoration: a bare `${VAR}` here would pass
    # the empty string through, and Caddy's `{$VAR:fallback}` does NOT fire for a variable that is present and
    # empty (measured, caddy:2 v2.11.4) — which is the dead edge, back.
    environment:
      FORGE_DOMAIN: ${FORGE_DOMAIN:?set FORGE_DOMAIN (.env) to the public storefront hostname}
      FORGE_ADMIN_DOMAIN: ${FORGE_ADMIN_DOMAIN:?set FORGE_ADMIN_DOMAIN (.env) to the admin hostname}
      FORGE_OUTLET_DOMAIN: ${FORGE_OUTLET_DOMAIN:-outlet.unset.localhost}
      FORGE_CAFE_DOMAIN: ${FORGE_CAFE_DOMAIN:-cafe.unset.localhost}
      FORGE_CAFE_ADMIN_DOMAIN: ${FORGE_CAFE_ADMIN_DOMAIN:-admin-cafe.unset.localhost}
      FORGE_TOTEM_DOMAIN: ${FORGE_TOTEM_DOMAIN:-totem.unset.localhost}
      FORGE_CONTROL_ALLOW_CIDR: ${FORGE_CONTROL_ALLOW_CIDR:-127.0.0.1/32}
    volumes:
      - ${FORGE_CADDYFILE:-./caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${FORGE_TLS_CERT_DIR:-./caddy/certs}:/etc/caddy/certs:ro
      - ${FORGE_CADDY_EXTRA_DIR:-./caddy/extra}:/etc/caddy/extra:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - kernel
      - storefront
      - checkout
      - admin
    # ★★ THE EDGE SAYS WHETHER IT IS UP, LIKE EVERY OTHER CONTAINER ON THIS BOX (C6, 05/09).
    #
    # It did not, and it is the container an operator looks at first. Measured on the live bench: eight of
    # nine rows of `docker ps` read `(healthy)` and this one read `Up About a minute` — while serving every
    # one of the other eight. `docker inspect … .Config.Healthcheck` answered `null`, because `caddy:2` is an
    # upstream image that carries none and compose is the only place this box can declare one. A row that is
    # permanently blank is not "unknown", it is a row people stop reading; on the day the edge is really down
    # it says exactly what it said yesterday.
    #
    # ⚠️ IT ASKS ABOUT THE EDGE AND NOT ABOUT ITS UPSTREAMS. A probe through `/health` or through a site
    # would go red whenever the kernel restarts — naming the wrong container, which is the same wrong errand
    # as the blank column. What Caddy can honestly answer for is its own listener: `caddy run` binds :80 only
    # after the Caddyfile parsed, and a Caddyfile it cannot parse makes the process EXIT instead of serving.
    # So "listening on 80" is exactly "a config loaded and this edge is serving it".
    #
    # ★ :80 AND NOT :443, MEASURED INSIDE THE RUNNING CONTAINER (05/09): `nc -z 127.0.0.1 80` → 0 and
    # `nc -z 127.0.0.1 443` → 1, because the bench runs `caddy/Caddyfile.local`, which is HTTP-only. :80 is
    # the one port bound in BOTH modes, so the probe means the same thing on the bench and in a deployment.
    # `nc` is in the stock `caddy:2` image (verified with `command -v`), so this adds no layer and no tool.
    #
    # The numbers are the house's: the same interval/timeout/retries the fronts declare in their own
    # Dockerfiles (totem/Dockerfile, storefront-coffee/Dockerfile). `bin/container-health.guard.mjs` derives
    # the rule — every third-party image on this box declares a probe here — rather than listing the services.
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '80']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  # Cache + sessions. Degradable: if redis is down the store gets slower, not wrong.
  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ★★★ DIFFERENCE 4 — THE BENCH'S MAILBOX, AND IT IS BEHIND A PROFILE SO A DEPLOYMENT NEVER GETS ONE.
  #
  # ⛔ THE DEFECT, MEASURED ON BOTH BENCHES 2026-09-13: `docker ps -a` showed ZERO mail containers and the
  # four `FORGE_SMTP_*` pointed at Resend. So the only deliverable address on this box was the owner's own
  # (it is in the dataset), and NOBODY ELSE COULD LOG IN — not as a shopper, not as an operator. `pk34/p1`
  # stopped on exactly that and refused to fake a session, which was right.
  #
  # ⚠️ AND THE OBVIOUS ESCAPE DOES NOT EXIST HERE. The transport that PRINTS the code to a terminal is
  # constructible only under `!production` (apps/api/src/smtp-channel-driver.ts, deliberately: a credential
  # printed to a terminal must be impossible in production BY CONSTRUCTION), and this box declares
  # `NODE_ENV: production` up at the kernel. A collector is the way that does not weaken anything.
  #
  # ★★ A PROFILE IS THE DECLARATION. A service carrying `profiles:` is not created by `docker compose up`
  # unless something asks for the profile, so this row is inert everywhere until a `.env` says otherwise —
  # which is the distinction §1 of the brief demands be DECLARED and not accidental. The one thing that asks
  # is `FORGE_BENCH_MAILBOX` in `.env`; `env-source.sh` turns that single fact into the profile AND into the
  # four `FORGE_SMTP_*` AND into `FORGE_MAIL_CA`, because three facts that can disagree is how a box ends up
  # sending real mail while an operator believes it is captured.
  #
  # ⚠️ THE THREE FLAGS ARE THE DRIVER'S CONTRACT, NOT TASTE (mail/README.md carries the measurement):
  #   · `--smtp-tls-cert/--smtp-tls-key` — the driver FORCES `STARTTLS`; mailpit's default has none and the
  #     send dies `ETLS 502 5.5.1 Not implemented`.
  #   · `--smtp-auth-accept-any` — the four variables travel together, so one of them is a password and the
  #     driver always sends `AUTH`. The collector accepts any, because there is nothing here to protect.
  #   · `--smtp-auth-allow-insecure` — `AUTH` is offered before the upgrade; without it the collector refuses
  #     the credential it is about to ignore.
  #
  # ⛔ PINNED BY VERSION, like everything else this box starts. `latest` on a bench is a box that changes
  # under whoever is testing it.
  mailpit:
    image: axllent/mailpit:v1.31.1
    profiles: ['bench-mailbox']
    restart: unless-stopped
    command:
      - --smtp-tls-cert=/certs/bench-collector.crt
      - --smtp-tls-key=/certs/bench-collector.key
      - --smtp-auth-accept-any
      - --smtp-auth-allow-insecure
    volumes:
      - ./mail:/certs:ro
    ports:
      # The web face, on the same interface every other door of this box is published on. The SMTP port is
      # deliberately NOT published: the only thing that speaks to it is the kernel, by service name.
      - '${FORGE_BENCH_BIND?see .env.example — 127.0.0.1 on a bench, EMPTY to publish on every interface}:${FORGE_MAIL_HTTP_PORT:-8204}:8025'
    # ⚠️ THE IMAGE ALREADY CARRIES ONE (`/mailpit readyz`, verified with `docker inspect`), so this line is a
    # RESTATEMENT — and `bin/container-health.guard.mjs` asks for it anyway, because its rule is "a
    # third-party tag declares its probe HERE" and that rule cannot look inside an image it has not pulled.
    # Restating the image's own probe is cheap and true; weakening the rule to trust an unread image is not.
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  # The hydrated photo tree (3.6 GB). Named, so a re-seed skips what is already on disk.
  seed_photos:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  media:
