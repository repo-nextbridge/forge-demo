# THE DEPLOYABLES THIS REPOSITORY BUILDS INSTEAD OF PINNING — the coffee vitrine, and the counter's totem.
#
# `docker compose` merges this file into `compose.yml` automatically whenever it exists, which is the seam
# that file left open: the coffee front is a FORK (slice C1 — `pack-surface` cut `storefront-coffee/` out of
# the Forge storefront and this repository owns every line of it), so it is not one of the four images
# `forge.lock` pins. Whoever creates a deployable wires it.
#
# ★★ v032/C — THEY ARE PINNED NOW, LIKE THE FOUR. Until v0.3.2 these two travelled by a `:local` tag and
# `forge.lock` said nothing about them, because the script that wrote the lock (`bin/build-local.sh`) rebuilt
# it from a fixed four-image template and would have deleted a fifth key. That script is gone: `bin/bake.sh`
# bakes all SIX images in one gesture (in this repository's CI, `.github/workflows/bake.yml`) and writes all
# six into the lock by digest — `{ ref, origin: "own build", built_from: <release> }`, the same vocabulary as
# the four (spec v032, decision 7). A tag nobody pins was measured shipping an 18-hour-old front on
# 2026-09-18 (bin/deploy.sh, `ship_image`); a digest cannot.
#
# What stays different is only what they ARE: the four are the product's recipe baked with this box's list,
# these two are OURS — source in this repository, no upstream, never merged.
#
# ── WHERE THE IMAGE COMES FROM ───────────────────────────────────────────────────────────────────────────
#     source bin/images-from-lock.sh      # exports FORGE_STOREFRONT_COFFEE_IMAGE and FORGE_TOTEM_IMAGE too
#
# A bench bakes its own with `bash bin/bake-local.sh` (same recipe, refs that never leave this daemon). The
# Dockerfile is thin ON PURPOSE (it copies the build `bin/bake.sh` ran), so the build that ships is the build
# that was tested, byte for byte — not a second one that ran in a layer.

services:
  storefront-coffee:
    # ★ BY DIGEST, FROM THE LOCK — the same door as the four images in compose.yml.
    image: ${FORGE_STOREFRONT_COFFEE_IMAGE:?run `source bin/images-from-lock.sh` first — the image ref comes from forge.lock}
    restart: unless-stopped
    environment:
      # ⚠️ F11 (2ª vez, 04/09) — o fork aquece pelas MESMAS rotas; sem isto ele resolve a origem
      # pelo host da requisição + `x-forwarded-proto` e monta URLs em http:// que este host não serve.
      FORGE_PUBLIC_ORIGIN: ${FORGE_PUBLIC_ORIGIN:-}
      # ★ The fork walks its sitemap through `instanceReadClient()`, which picks the BULK face when this is
      # declared and the shopper's face when it is not — see `storefront-coffee/src/lib/sitemap-data.ts`.
      FORGE_BULK_READ_TOKEN: ${FORGE_BULK_READ_TOKEN:-}
      NODE_ENV: production
      PORT: 3000
      # The SAME kernel as every other front on this box, and it has to be: the cart a shopper fills here is
      # a cookie holding a kernel cart id, so a vitrine pointed elsewhere hands the checkout an empty bag.
      FORGE_READ_BASE_URL: http://kernel:3000
      FORGE_COMMAND_BASE_URL: http://kernel:3000
      FORGE_STORE_HOSTS: ${FORGE_STORE_HOSTS:-}
      # Product photographs are resolved in THIS process (the port answers with refs; the base makes them
      # addresses), so it needs the same media base the kernel and the reference vitrine carry. Without it
      # the six coffees render as placeholders and nothing logs an error.
      FORGE_MEDIA_BASE_URL: ${FORGE_MEDIA_BASE_URL:-}
      FORGE_REVALIDATE_SECRET: ${FORGE_REVALIDATE_SECRET:-}
      # ★ THE THEME, AND IT IS THE SAME MOUNT THE OTHER TWO FRONTS TAKE. The store names `coffee-store` in
      # its own row (`theme_key`), and a front that cannot find the folder falls back to the base theme — it
      # never fails. So a missing mount here is not an outage, it is a shop quietly wearing the wrong
      # clothes, which is exactly the kind of thing nobody notices in a demo until it is on a screen.
      FORGE_THEMES_DIR: ${FORGE_THEMES_DIR:-/app/themes-instance}
      # ★★ THE STORE THIS IMAGE IS THE FORK OF — the third consumer of the technique step 3c already uses.
      #
      # It selects WHOSE version of an institutional template renders (`src/templates/cms/registry.ts`): the
      # café gets its own «Sobre», every other store of this image gets the shared body. The value CANNOT be
      # written into the source, because a store id is a ULID minted fresh on every `bash bin/box-up.sh` — the
      # exact rot that made the café's generated edge rule (`caddy/extra-local/coffee.caddy`) match nothing
      # and hand every café request to the
      # VANILLA storefront, while the page still looked right because the theme comes from the store's row.
      #
      # ⚠️ SOFT (`:-`), UNLIKE THE TOTEM'S BELOW, AND THE DIFFERENCE IS DELIBERATE. A totem with no store is
      # the wrong shop and must not boot. A vitrine with no overlay is this vitrine as it was before the axis
      # existed: every page still answers 200, in the body shared with the reference storefront. Refusing to
      # start the shop over one paragraph would trade a visible defect for an outage — so the loss is a
      # warning at runtime and a RED in `bin/coffee-store-id.guard.mjs`, which is where it can be caught
      # before a bench ever sees it.
      FORGE_COFFEE_STORE_ID: ${FORGE_COFFEE_STORE_ID:-}
      # ★★ pk35/d3 — THE GATE'S OWN WIRING, AND THIS SERVICE WAS THE ONLY FRONT NOT GETTING IT.
      #
      # Measured on this file before the slice: `compose.yml` hands these two to the storefront (:174) and to
      # the checkout (:227), and the totem takes them below (:132) — this service took NEITHER. The gate's
      # entry is a Server Component, so its links are resolved where the component runs: the day this fork
      # draws a gate, it would draw it HERE, with the app's own wiring falling back to the
      # canonical site and to NO admin link at all. ⛔ NO APP OF THIS BOX FILLS THAT SLOT SINCE v0.4 — see
      # `compose.yml` beside the same two variables for why they are still declared. And a fallback is exactly the shape nothing accuses — the
      # page renders, the button for the admin is simply not there, and every other front has it.
      #
      # ⚠️ SOFT (`:-`) LIKE ITS THREE SIBLINGS, and the emptiness is handled at the other end: `wiring.ts` uses
      # `||`, not `??`, because compose passes an UNSET variable as the empty string rather than as absent.
      FORGE_GATE_SITE_URL: ${FORGE_GATE_SITE_URL:-}
      # The same scope the other two fronts get — a dismissal written by one and deleted by another at a
      # DIFFERENT scope would delete nothing, which is the silent half `cookie-scope.ts` warns about.
      FORGE_STOREFRONT_GATE_COOKIE_DOMAIN: ${FORGE_STOREFRONT_GATE_COOKIE_DOMAIN:-}
      FORGE_GATE_ADMIN_URLS: ${FORGE_GATE_ADMIN_URLS:-}
      # ★★★ v0.3.3 (VC-1) — THE SAME CEILING THE REFERENCE VITRINE GOT, AND A FORK GETS IT ONLY BY WIRING IT.
      # The release says so in as many words: "A storefront of your own gets the cap only if it wires the
      # handler". This one does — `storefront-coffee/next.config.mjs` names `data-cache-handler.mjs`, the
      # template's one-line door to `@forgeco/storefront-kit/data-cache-handler` — and these are the
      # template's three lines. Without both, Next's built-in store writes one file per URL into the container
      # layer and never deletes one: the 86 GB of 2026-10-19 on this box. Same knobs as `compose.yml`'s
      # vitrine, a volume of its OWN: the handler's LRU index is per process, so two fronts on one directory
      # would each count only their own bytes against the ceiling.
      FORGE_DATA_CACHE_DIR: /var/cache/forge-storefront
      FORGE_DATA_CACHE_MAX_MB: ${FORGE_DATA_CACHE_MAX_MB:-}
      FORGE_DATA_CACHE_MIN_FREE_PERCENT: ${FORGE_DATA_CACHE_MIN_FREE_PERCENT:-}
    volumes:
      - ${FORGE_THEMES_HOST_DIR:-./themes}:/app/themes-instance:ro
      # VC-1 — derived from the database, so `bin/box-down.sh` calls it STATE (a restore starts it empty).
      - storefront_coffee_cache:/var/cache/forge-storefront
    depends_on:
      - kernel

  # ════════════════════════════════════════════════════════════════════════════════════════════════════════
  # ★★ THE COUNTER'S TOTEM (T2·S2) — the SIXTH image of this instance, and the fourth posture of the
  # customisation table made real: not a forked vitrine plus a forked checkout, but ONE Next app of the
  # client's own serving every path of the counter's host, against the same port, in the same box.
  #
  # "Nem toda experiência extra é fork — pode ser uma imagem A MAIS." Today a totem; tomorrow an internal app.
  #
  # ── ★ v032/C — IT IS IN `forge.lock` NOW (key `totem`), by digest, like the vitrine above. ──────────────
  #
  # It used to be absent for a reason about the FILE, not an analogy: `bin/build-local.sh` rewrote the lock
  # from a fixed four-image template and would have deleted a `totem` key in silence. `bin/bake.sh` writes all
  # six, so the reason is gone and so is the absence (spec v032, decision 7). `totem/src/lock-provenance.test.ts`
  # holds the new shape: the lock pins it, and this service reads it from there.
  totem:
    # ★ BY DIGEST, FROM THE LOCK — the same door as the four images in compose.yml.
    image: ${FORGE_TOTEM_IMAGE:?run `source bin/images-from-lock.sh` first — the image ref comes from forge.lock}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # The SAME kernel as every other front on this box. The counter's basket is a kernel cart behind a
      # cookie, so a totem pointed elsewhere is a till that cannot take an order.
      FORGE_READ_BASE_URL: http://kernel:3000
      FORGE_COMMAND_BASE_URL: http://kernel:3000
      # Product photographs are resolved in THIS process (the port answers with refs; the base makes them
      # addresses). Without it the menu renders as empty frames and nothing logs an error.
      FORGE_MEDIA_BASE_URL: ${FORGE_MEDIA_BASE_URL:-}
      # ★★ THE STORE, AND IT TAKES TWO VARIABLES ON PURPOSE — see `totem/src/lib/store.ts` for the
      # measurement. The public read face resolves a store by ID or by HOST and has no `store.by_handle`
      # (the only capability returning a handle is on the internal face, behind the admin service token,
      # which this app deliberately does not hold). So the ID is what the process uses and the HANDLE is
      # what a human reads to know which shop that id is. The app refuses to boot if either is missing, or
      # if the handle was pasted into the id.
      FORGE_TOTEM_STORE_ID: ${FORGE_TOTEM_STORE_ID:?set FORGE_TOTEM_STORE_ID (.env) to the counter store's sto_… id}
      FORGE_TOTEM_STORE_HANDLE: ${FORGE_TOTEM_STORE_HANDLE:-balcao}
      # How long the screen waits before it decides the customer has walked away, clears the basket and
      # returns to "Toque para começar". Seconds.
      FORGE_TOTEM_IDLE_SECONDS: ${FORGE_TOTEM_IDLE_SECONDS:-90}
      # ★★ POS-DEMO-PURGE (2026-10-20) — THE SAME PURGE SECRET AS EVERY OTHER FRONT, because the kernel now posts
      # here too (see `kernel:` below) and `totem/src/app/api/revalidate/route.ts` refuses every call when this is
      # empty. Without it the counter's cache, on a volume since VC-1, lives out its TTL (up to an hour).
      FORGE_REVALIDATE_SECRET: ${FORGE_REVALIDATE_SECRET:-}
      # ★ THE GATE'S OWN WIRING, and it is read by the FRONT that renders it — the same two variables
      # `compose.yml` gives the storefront and the checkout, for the same reason: the gate's entry is a
      # Server Component, so its links live where the component runs. They never reach the browser.
      FORGE_GATE_SITE_URL: ${FORGE_GATE_SITE_URL:-}
      # The same scope the other two fronts get — a dismissal written by one and deleted by another at a
      # DIFFERENT scope would delete nothing, which is the silent half `cookie-scope.ts` warns about.
      FORGE_STOREFRONT_GATE_COOKIE_DOMAIN: ${FORGE_STOREFRONT_GATE_COOKIE_DOMAIN:-}
      FORGE_GATE_ADMIN_URLS: ${FORGE_GATE_ADMIN_URLS:-}
      # ★★ v0.3.3 (VC-1) — THE TOTEM CACHES TOO, WHICH ITS `force-dynamic` PAGE DOES NOT MAKE OBVIOUS. The page
      # renders per request, but every read goes through the kit's `createReadClient`, which asks for
      # `next: { revalidate, tags }` — and Next 15.2.9 turns `force-dynamic` into "do not cache" ONLY for a
      # fetch with no cache config of its own (`noFetchConfigAndForceDynamic`, next/dist/server/lib/
      # patch-fetch.js). So the menu's reads ARE Data Cache entries, and `totem/next.config.mjs` names the
      # kit's handler for the same reason the café's does. Its own volume, same knobs.
      FORGE_DATA_CACHE_DIR: /var/cache/forge-storefront
      FORGE_DATA_CACHE_MAX_MB: ${FORGE_DATA_CACHE_MAX_MB:-}
      FORGE_DATA_CACHE_MIN_FREE_PERCENT: ${FORGE_DATA_CACHE_MIN_FREE_PERCENT:-}
    volumes:
      - totem_cache:/var/cache/forge-storefront
    depends_on:
      - kernel

  # ── ★★ POS-DEMO-PURGE (2026-10-20) · THE KERNEL PURGES EVERY FRONT THAT CACHES, NOT ONLY THE REFERENCE ONE ──
  #
  # MEASURED in the v0.3.3 blind rehearsal (phase 7/7b): `compose.yml` names one target,
  # `http://storefront:3000`, and the kernel boots saying `storefront cache invalidation ON — 1 target(s)`.
  # Since VC-1 (#45) the café's and the totem's data caches live on volumes and survive a deploy, so a price
  # changed in the admin reached those two fronts only when the read's TTL ran out — up to an hour.
  #
  # The kernel takes a LIST, comma-separated, and posts every event to every entry: published at v0.3.3 in the
  # product's `docs/guides/demo-local.md` ("A list — several origins separated by commas are all purged") and
  # `docs/operations/performance.md`, and its boot line counts "N target(s)". ⚠️ The template's own comment
  # (`templates/instance/compose.yml`) still says "the storefront", singular — the list is not in it.
  #
  # Written HERE and not in `compose.yml` for the reason the file's header gives: these two fronts are this
  # repository's deployables, so the targets that name them live where the services do (compose merges
  # `environment` by key, so this line wins). The same purge secret as before: each front carries
  # FORGE_REVALIDATE_SECRET. Every target is the front's PROCESS on the compose network, never its edge.
  #
  # MEASURED on a local bench, 2026-10-20 (the three 250 g SKUs of one coffee repriced through the port):
  # with this list the café's page and the totem's menu showed the new price in 0.6–1.3 s (5 runs); with the
  # old one-target list both still showed the old price 120 s later while the port already answered the new.
  #
  # ⚠️ IT TRIPLES THE POSTS. ONE POST per event per target (one event → one call carrying all its tags, e.g.
  # `tag=store:<café>&tag=store:<balcão>`), and every event of EVERY tenant goes to every target — the café
  # receives the main shop's purges and the reverse. An idle box posts nothing; the curated seed of a bench
  # emitted 588 events in 12 s (≈ 2 900/min → ≈ 8 800 POSTs/min at three targets). A tag a front never cached
  # answers 200 on all three; only a missing tag (400) or a wrong secret (401) is an error.
  # ⚠️ A TARGET THAT IS DOWN RETRIES THE WHOLE EVENT (`relay retry … failed on 2 of 3 target(s)`, measured
  # while the bench held the café and the totem for after its seed hook): the healthy targets are posted
  # again, and past the relay's attempts the event dead-letters. Start the fronts with the kernel.
  # `bin/purge-targets.guard.mjs` goes red when a front that mounts a data-cache volume is missing here, or
  # when a target names no service.
  kernel:
    environment:
      FORGE_STOREFRONT_URL: ${FORGE_STOREFRONT_URL:-http://storefront:3000,http://storefront-coffee:3000,http://totem:3000}

  # ── THE ADMIN'S SIBLING SWITCHER (A44) ──────────────────────────────────────────────────────────────────
  #
  # ⚠️ THIS BLOCK IS THE HALF THAT WAS MISSING, AND MEASURED: `compose.yml` passes the admin sixteen
  # variables and `FORGE_ADMIN_SIBLINGS` is not one of them. So the value could sit in `.env`, correct and
  # complete, and the container would never see it — the dropdown stays absent and nothing anywhere says why.
  #
  # It is written HERE rather than in `compose.yml` for the reason that file's own comments give: `compose.yml`
  # is the PRODUCT's file, this one is the box's. The switcher is a fact about THIS instance — that it hosts
  # two brands whose admins are two ports of one container — and `apps/admin/src/lib/siblings.ts` is explicit
  # that the list is configuration of whoever deploys and must never be discovered from the kernel (listing an
  # instance's tenants is a PLATFORM read; a tenant operator learning who else lives on the box is a leak).
  #
  # The VALUE is derived at birth by `bin/box-up.sh` (step 3d) from `seed/box.json`, and rewritten by
  # `--tailnet`. Compose only has to carry it across.
  admin:
    environment:
      FORGE_ADMIN_SIBLINGS: ${FORGE_ADMIN_SIBLINGS:-}

  # ★ THE EDGE PUBLISHES ONE MORE PORT, AND THAT IS THE WHOLE ROUTING CHANGE.
  #
  # `caddy/Caddyfile.local` gains a `:82` site pointing at `totem:3000`, mirroring the `:81` the admin already
  # has, and this block is what makes it reachable from the host. It is written HERE rather than in
  # `compose.yml` because the totem is this repository's deployable and `compose.yml` is the product's file —
  # the same split the vitrine's service above lives by. Compose MERGES sequences like `ports`, so this adds
  # to the three that file publishes instead of replacing them.
  #
  # ⚠️ Harmless in a deployment, exactly like the admin's `:81`: the production Caddyfile serves the counter
  # on `{$FORGE_TOTEM_DOMAIN}` with TLS, has no `:82` site, and nothing answers on this published port.
  #
  # ⚠️ THE FALLBACK IS THE BENCH'S NUMBER AND IT IS COPIED FROM `.env.example`, NOT CHOSEN HERE. Because the
  # published port is inert in a deployment (the paragraph above), this default only ever acts on a bench —
  # so it has to be the bench's door, which `.env.example` declares and `bin/bench-ports.guard.mjs` holds it
  # to. It said 8102 until 2026-09-07, left behind when `b9142c8` moved the bench into the 82xx family by
  # editing `.env.example` alone: with a `.env` present the two agreed, and a box WITHOUT the variable
  # published 8102 while the README and the birth summary announced 8203.
  #
  # ⚠️ AND IT CARRIES THE SAME BIND AS ITS FOUR SIBLINGS (pk24/d4). The counter is a whole-host Next app on
  # the same plain-http edge, so beyond loopback it is the same trap: it answers 200 and the browser keeps no
  # cookie it set. `${FORGE_BENCH_BIND?…}` is deliberately the colon-less form — the box has to DECLARE its
  # exposure; empty means every interface and is what a deployment says. compose.yml carries the measurement.
  caddy:
    ports:
      - '${FORGE_BENCH_BIND?see .env.example — 127.0.0.1 on a bench, EMPTY to publish on every interface}:${FORGE_TOTEM_HTTP_PORT:-8203}:82'
    # ★★ A10 — THE BENCH EDGE'S OWN EXTENSION FOLDER, AND IT IS A SECOND FOLDER ON PURPOSE.
    #
    # `compose.yml` already mounts `caddy/extra/`, which `caddy/Caddyfile` imports at TOP level: every file
    # there is parsed as a SITE BLOCK. `caddy/Caddyfile.local` imports its own folder from INSIDE its `:80`
    # site block, so what it reads are FRAGMENTS (bare `handle` blocks) — and the two shapes cannot share a
    # directory. They did: both globs pointed at `caddy/extra/`, on the theory that `*.local.caddy` was
    # narrower than `*.caddy`. It is a strict SUBSET, so production imported the bench's fragment at top
    # level and `caddy validate` refused the whole file — store, checkout and admin down together, and never
    # visible on the bench, which reads the other top-level file.
    #
    # It is written HERE and not in `compose.yml` for the reason the `:82` port above is: that file is the
    # product's shape and this folder is the BENCH's. It is inert in a deployment — `caddy/Caddyfile` imports
    # nothing from it — exactly like the published port right above.
    #
    # ⚠️ `bin/box-up.sh` (step 3c) WRITES into this folder. Move it here and forget the writer and the café's
    # front becomes unreachable while every page still answers 200 (the request falls through to the vanilla
    # storefront, which paints the store with its own theme). `bin/caddy-extra-door.guard.mjs` pairs the two.
    volumes:
      - ${FORGE_CADDY_EXTRA_LOCAL_DIR:-./caddy/extra-local}:/etc/caddy/extra-local:ro

# ★ VC-1 — THE TWO DATA-CACHE VOLUMES OF THIS FILE'S FRONTS, declared beside the services that mount them (compose
# merges top-level `volumes:` across files). Derived and disposable: `bin/box-down.sh` destroys them with the
# database, and they refill from the kernel on the next visit.
volumes:
  storefront_coffee_cache:
  totem_cache:
