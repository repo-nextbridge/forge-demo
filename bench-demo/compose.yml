# ★ IB-3 — THIS BOX ON THE FORGE BENCH KIT: the demo's half of `bash bench/up.sh`, merged through the kit's
# own seam (`FORGE_BENCH_COMPOSE_FILES` in bench/bench.env) AFTER compose.yml + compose.override.yml and BEFORE
# the kit's overlay. It is never run alone, and nothing outside the kit reads it.
#
# The kit (bench/, byte for byte the template's — bench-kit.lock) was written against the TEMPLATE's
# compose.yml. This box's grew three things the kit cannot know about, and each is answered here, by
# replacement, without touching compose.yml (a deployment reads compose.yml exactly as before):
#
#   1. FORGE_PUBLIC_ORIGIN. This compose hands every front and the kernel `FORGE_PUBLIC_ORIGIN`; the kit
#      derives the bench's address as FORGE_BENCH_ORIGIN (localhost, or the promoted https door) and never
#      names ours. So each service that reads it is re-pointed at the kit's — which is what makes a promotion
#      move it too (measured 2026-10-10: `promote.sh 192.168.1.221` → the kernel's FORGE_PUBLIC_ORIGIN
#      `https://192.168.1.221:<NN43>`, and back to `http://localhost:<NN00>`).
#   2. The mailbox's PROFILE. compose.yml declares `mailpit` behind `bench-mailbox` (a deployment never
#      creates it), and the kit's overlay makes the kernel DEPEND on `mailpit`. With the profile inactive the
#      project is invalid and the kit stops at its step 2, before anything is created — measured 2026-10-10
#      with this entry removed: «service "kernel" depends on undefined service "mailpit": invalid compose
#      project», `bench/up.sh` RC 1. On a kit bench the mailbox is the kit's, unconditionally: profile reset.
#   3. The café's services OFF. compose.override.yml is merged by the kit whether we ask or not (lib.sh,
#      `bench_compose`), and it brings `storefront-coffee` and `totem`. Both serve the forgecafe tenant, which
#      a kit bench does not have (the kit provisions ONE tenant — README §2). Behind a profile nobody
#      activates, they are not created (the totem would otherwise be created with the placeholder id bench/bench.env
#      carries only so compose can read compose.override.yml).
#
# ⚠️ What is NOT here, on purpose: ports. The kit's overlay publishes the caddy with `ports: !override` AFTER
# this file, so a door added here (the totem's :82, the café admin's :83) would be dropped without a word —
# measured 2026-10-10: `127.0.0.1:<NN03>:82` added under `caddy.ports` here → `bash bench/compose.sh config`
# publishes <NN00> and <NN01> only. That is a requirement on the kit, listed in README §2, not something to work
# around in this file.

services:
  kernel:
    environment:
      FORGE_PUBLIC_ORIGIN: ${FORGE_BENCH_ORIGIN:?run the bench through bash bench/up.sh}

  storefront:
    environment:
      FORGE_PUBLIC_ORIGIN: ${FORGE_BENCH_ORIGIN:?run the bench through bash bench/up.sh}
      # The fronts join media base + key SERVER-SIDE (the `/api/img` door, compose.yml DIFFERENCE 4). The kit
      # exports FORGE_MEDIA_BASE_URL as the PUBLIC base it hands the kernel; inside this container that is
      # `localhost` = the container itself. compose.yml's own default, the compose network, is restated.
      FORGE_MEDIA_BASE_URL: http://kernel:3000/v1/media/local

  checkout:
    environment:
      FORGE_PUBLIC_ORIGIN: ${FORGE_BENCH_ORIGIN:?run the bench through bash bench/up.sh}
      FORGE_MEDIA_BASE_URL: http://kernel:3000/v1/media/local

  mailpit:
    profiles: !reset []

  storefront-coffee:
    profiles: ['forgecafe-by-box-up']

  totem:
    profiles: ['forgecafe-by-box-up']
