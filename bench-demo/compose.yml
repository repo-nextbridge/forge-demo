# ★ THIS BOX ON THE FORGE BENCH KIT: the demo's half of `bash bench/up.sh`, merged through the kit's own seam
# (`FORGE_BENCH_COMPOSE_FILES` in bench/bench.env) AFTER compose.yml + compose.override.yml and BEFORE the kit's
# overlay. It is never run alone, and nothing outside the kit reads it.
#
# What the kit of IB-4 now does itself, so this file no longer says it (IB-5; it said all three under IB-3):
#   · FORGE_PUBLIC_ORIGIN — bench/bench.env declares it as `${FORGE_BENCH_ORIGIN}`, expanded by the kit after it
#     derives the address, so a promotion moves it (the kernel's and every front's);
#   · the mailbox's profile — the kit resets the profile of its own services (compose.bench.yml), so `mailpit`
#     behind `bench-mailbox` no longer makes the project invalid;
#   · the café's services — no longer switched off: two tenants (FORGE_BENCH_TENANTS), the totem's door declared
#     (FORGE_BENCH_DOORS), both held for after the seed hook (FORGE_BENCH_AFTER_HOOK).
#
# What is left is the one thing that is this box's and not the kit's: a front that joins media base + key
# SERVER-SIDE (the `/api/img` · `/api/media/<key>` door, compose.yml DIFFERENCE 4). The kit exports
# FORGE_MEDIA_BASE_URL as the PUBLIC base it hands the kernel (`http://localhost:<NN00>/v1/media/local`); inside a
# front's container `localhost` is the container itself. compose.yml's own default, the compose network, is
# restated for each front that fetches media in its own process: the vitrine, the checkout and the café's fork
# (storefront-coffee/src/app/api/media/[...key]/route.ts). NOT the totem: it renders the kernel's own url
# (`mediaSrc(…).url`, totem/src/lib/menu.ts) and has no media route — read 2026-10-10, so nothing to restate.
services:
  storefront:
    environment:
      FORGE_MEDIA_BASE_URL: http://kernel:3000/v1/media/local
  checkout:
    environment:
      FORGE_MEDIA_BASE_URL: http://kernel:3000/v1/media/local
  storefront-coffee:
    environment:
      FORGE_MEDIA_BASE_URL: http://kernel:3000/v1/media/local
